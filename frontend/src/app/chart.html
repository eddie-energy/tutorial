<h3>Readings</h3>

<label>
  Time range
  <select [value]="selectedRange()" (change)="onRangeChange($event)">
    <option value="day">Last 24 hours</option>
    <option value="week">Last 7 days</option>
    <option value="month">Last 30 days</option>
  </select>
</label>

@if (loading()) {
  <p>Loading readings...</p>
}

@if (error()) {
  <p>{{ error() }}</p>
}

<div #chart></div>
